name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # These two gates need no dependencies, so a taxonomy or originality
      # regression fails in seconds rather than after an install.
      - name: Facet taxonomy is well-formed
        run: npm run check:taxonomy

      - name: Originality & house rules
        run: npm run check:originality

      - run: npm ci

      - name: Unit tests (incl. the WCAG contrast contract)
        run: npm test

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      # Reads the prerendered HTML that `next build` leaves behind, so it has to
      # run after the build.
      - name: Heading order
        run: npm run lint:headings
